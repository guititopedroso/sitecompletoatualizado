name: Build and Sign iOS App (OTA IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS & CocoaPods
        run: |
          npx cap add ios || true
          npx cap sync ios || true
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install || true
            cd ../..
          fi

      - name: Setup iOS Signing Certificate & Keychain
        env:
          KEYCHAIN_PASSWORD: "buildkeychain123"
        run: |
          mkdir -p certs
          python3 -c "import base64; open('certs/cert.p12', 'wb').write(base64.b64decode(open('certs/boc_p12_b64.txt').read().strip()))" || true
          python3 -c "import base64; open('certs/profile.mobileprovision', 'wb').write(base64.b64decode(open('certs/boc_prov_b64.txt').read().strip()))" || true

          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if [ -f "certs/cert.p12" ]; then
            security import certs/cert.p12 -k "$KEYCHAIN_PATH" -P "" -A -t cert -f pkcs12 || \
            security import certs/cert.p12 -k "$KEYCHAIN_PATH" -P "WSF" -A -t cert -f pkcs12 || \
            security import certs/cert.p12 -k "$KEYCHAIN_PATH" -P "wsfteam" -A -t cert -f pkcs12 || true
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          fi

          if [ -f "certs/profile.mobileprovision" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            UUID=$(python3 -c "
          import plistlib
          with open('certs/profile.mobileprovision','rb') as f:
              data = f.read()
          xml_start = data.find(b'<?xml')
          xml_end = data.find(b'</plist>') + 8
          pl = plistlib.loads(data[xml_start:xml_end])
          print(pl['UUID'])
          " 2>/dev/null || echo "unknown")
            cp certs/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision" || true
            echo "Provisioning Profile UUID: $UUID"
          fi

      - name: Build Xcode Native iOS Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath archive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package Official iOS IPA
        run: |
          mkdir -p public/apps server/apps /tmp/staging/Payload

          # Copy Xcode compiled App.app bundle
          cp -R ios/App/archive.xcarchive/Products/Applications/App.app /tmp/staging/Payload/

          # Inject mobileprovision profile inside App.app
          if [ -f "certs/profile.mobileprovision" ]; then
            cp certs/profile.mobileprovision /tmp/staging/Payload/App.app/embedded.mobileprovision
          fi

          # Ensure web assets dist exist inside App.app
          cp -R dist/* /tmp/staging/Payload/App.app/ 2>/dev/null || true
          mkdir -p /tmp/staging/Payload/App.app/public
          cp -R dist/* /tmp/staging/Payload/App.app/public/ 2>/dev/null || true

          # Print verification info
          echo "📱 Conteúdo da pasta App.app compilada pelo Xcode:"
          ls -la /tmp/staging/Payload/App.app/

          echo "📱 Verificando executável nativo Xcode ARM64:"
          file /tmp/staging/Payload/App.app/App

          # Package into official Apple IPA structure (Payload/App.app at root)
          cd /tmp/staging
          zip -r $GITHUB_WORKSPACE/public/apps/royalcoast-admin.ipa Payload
          cp $GITHUB_WORKSPACE/public/apps/royalcoast-admin.ipa $GITHUB_WORKSPACE/server/apps/royalcoast-admin.ipa

          echo "✅ IPA oficial criado com sucesso! Tamanho: $(du -sh $GITHUB_WORKSPACE/public/apps/royalcoast-admin.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royalcoast-admin-ipa
          path: public/apps/royalcoast-admin.ipa

      - name: Release IPA Build
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "RoyalCoast Admin iOS IPA v1.0.0"
          make_latest: true
          files: |
            public/apps/royalcoast-admin.ipa
            public/apps/manifest.plist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
