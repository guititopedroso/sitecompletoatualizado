name: Build and Sign iOS App (OTA IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios || true

      - name: Setup iOS Signing Certificate
        run: |
          mkdir -p certs
          python3 -c "import base64; open('certs/cert.p12', 'wb').write(base64.b64decode(open('certs/boc_p12_b64.txt').read().strip()))" || true
          python3 -c "import base64; open('certs/profile.mobileprovision', 'wb').write(base64.b64decode(open('certs/boc_prov_b64.txt').read().strip()))" || true
          echo "Certificates extracted successfully"



      - name: Build Xcode IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath archive.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO || true


          xcodebuild -exportArchive \
            -archivePath archive.xcarchive \
            -exportOptionsPlist "../../scripts/exportOptions.plist" \
            -exportPath "../../build-output" \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Package & Sign IPA with zsign / Fastlane
        run: |
          mkdir -p public/apps server/apps
          node scripts/build-ipa.js

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royalcoast-admin-ipa
          path: public/apps/royalcoast-admin.ipa

      - name: Release IPA Build
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "RoyalCoast Admin iOS IPA"
          files: |
            public/apps/royalcoast-admin.ipa
            public/apps/manifest.plist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
