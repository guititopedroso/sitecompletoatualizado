name: Build and Sign iOS App (OTA IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios || true

      - name: Setup iOS Signing Certificate & Keychain
        env:
          KEYCHAIN_PASSWORD: "buildkeychain123"
        run: |
          # Extract certs from base64 files
          mkdir -p certs
          python3 -c "import base64; open('certs/cert.p12', 'wb').write(base64.b64decode(open('certs/boc_p12_b64.txt').read().strip()))" || true
          python3 -c "import base64; open('certs/profile.mobileprovision', 'wb').write(base64.b64decode(open('certs/boc_prov_b64.txt').read().strip()))" || true

          # Create a dedicated build keychain
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the .p12 certificate (try both blank and "WSF" passwords)
          if [ -f "certs/cert.p12" ]; then
            security import certs/cert.p12 -k "$KEYCHAIN_PATH" -P "" -A -t cert -f pkcs12 || \
            security import certs/cert.p12 -k "$KEYCHAIN_PATH" -P "WSF" -A -t cert -f pkcs12 || \
            security import certs/cert.p12 -k "$KEYCHAIN_PATH" -P "wsfteam" -A -t cert -f pkcs12 || true
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          fi

          # Install provisioning profile
          if [ -f "certs/profile.mobileprovision" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            UUID=$(python3 -c "
          import plistlib, re, sys
          with open('certs/profile.mobileprovision','rb') as f:
              data = f.read()
          xml_start = data.find(b'<?xml')
          xml_end = data.find(b'</plist>') + 8
          pl = plistlib.loads(data[xml_start:xml_end])
          print(pl['UUID'])
          " 2>/dev/null || echo "unknown")
            cp certs/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision" || true
            echo "Provisioning Profile UUID: $UUID"
          fi

      - name: Build Xcode Archive (Real Mach-O Binary)
        run: |
          cd ios/App
          # Try with code signing using installed certificate
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath archive.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 || \
          # Fallback: build without code signing (still compiles real ARM64 binary)
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath archive.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 || true

          # Check if archive was created
          if [ -d "archive.xcarchive" ]; then
            echo "✅ XCArchive criado com sucesso!"
            ls -la archive.xcarchive/Products/Applications/ 2>/dev/null || true
          else
            echo "❌ XCArchive não foi criado"
          fi

      - name: Package Real Mach-O IPA
        run: |
          mkdir -p public/apps server/apps

          APP_PATH="ios/App/archive.xcarchive/Products/Applications/App.app"

          if [ -d "$APP_PATH" ]; then
            echo "✅ Binário nativo App.app encontrado no XCArchive!"
            # Verify it has a real executable
            if [ -f "$APP_PATH/App" ]; then
              echo "✅ Executável ARM64 encontrado: $(file $APP_PATH/App)"
            fi
            # Package into proper IPA structure
            mkdir -p /tmp/ipa-package/Payload
            cp -R "$APP_PATH" /tmp/ipa-package/Payload/App.app
            # Inject provisioning profile if available
            if [ -f "certs/profile.mobileprovision" ]; then
              cp certs/profile.mobileprovision /tmp/ipa-package/Payload/App.app/embedded.mobileprovision
            fi
            cd /tmp/ipa-package
            zip -qr royalcoast-admin.ipa Payload/
            cp royalcoast-admin.ipa $GITHUB_WORKSPACE/public/apps/royalcoast-admin.ipa
            cp royalcoast-admin.ipa $GITHUB_WORKSPACE/server/apps/royalcoast-admin.ipa
            echo "✅ IPA criado com binário nativo real! $(du -sh royalcoast-admin.ipa)"
          else
            echo "❌ App.app não encontrado no archive. Usando fallback com binário mínimo..."
            node scripts/build-ipa.js
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: royalcoast-admin-ipa
          path: public/apps/royalcoast-admin.ipa

      - name: Release IPA Build
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "RoyalCoast Admin iOS IPA v1.0.0"
          make_latest: true
          files: |
            public/apps/royalcoast-admin.ipa
            public/apps/manifest.plist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
